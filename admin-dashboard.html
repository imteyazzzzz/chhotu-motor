<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>Overview | Chhotu Operations Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
  <script src="assets/admin.js" defer></script>
</head>
<body class="antialiased text-[#F4F1E8] overflow-x-hidden bg-[#14161A]">

  <div class="flex min-h-screen">
    <!-- Left Sidebar (dynamically populated by admin.js) -->
    <aside id="admin-sidebar" class="hidden lg:block w-[260px] bg-[#1B1E24] border-r border-[#3A3F49] shrink-0"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top Bar (dynamically populated by admin.js) -->
      <header id="admin-topbar" class="h-16 border-b border-[#3A3F49] bg-[#14161A] flex items-center justify-between px-6 shrink-0"></header>

      <!-- Dashboard Content -->
      <main class="flex-1 p-6 overflow-y-auto space-y-8">
        <div>
          <h1 class="text-2xl font-bold tracking-wide font-display" id="greeting-title">GOOD AFTERNOON, ADMIN</h1>
          <p class="text-xs text-[#B9B6AC] mt-1 font-mono">Here's today's operations snapshot at a glance.</p>
        </div>

        <!-- Stat Cards Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="card p-5 text-center space-y-1">
            <div id="stat-pending" class="font-mono text-3xl font-bold text-[#FFC530]">0</div>
            <div class="text-[10px] text-[#B9B6AC] uppercase tracking-wider font-display">Pending Bookings</div>
          </div>
          <div class="card p-5 text-center space-y-1">
            <div id="stat-progress" class="font-mono text-3xl font-bold text-[#FF5A1F]">0</div>
            <div class="text-[10px] text-[#B9B6AC] uppercase tracking-wider font-display">In Progress</div>
          </div>
          <div class="card p-5 text-center space-y-1">
            <div id="stat-completed" class="font-mono text-3xl font-bold text-green-400">0</div>
            <div class="text-[10px] text-[#B9B6AC] uppercase tracking-wider font-display">Completed Today</div>
          </div>
          <div id="stat-emergency-card" class="card p-5 text-center space-y-1 transition-all duration-300">
            <div id="stat-emergency" class="font-mono text-3xl font-bold text-red-500">0</div>
            <div class="text-[10px] text-[#B9B6AC] uppercase tracking-wider font-display">Emergency Unassigned</div>
          </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
          <!-- Live Bookings Feed (Left 2 cols) -->
          <div class="lg:col-span-2 space-y-4">
            <div class="flex justify-between items-center border-b border-[#3A3F49] pb-2">
              <h3 class="font-display text-sm text-[#FF5A1F] tracking-wide uppercase">Live Bookings Feed</h3>
              <a href="admin-bookings.html" class="text-[10px] font-mono text-[#B9B6AC] hover:text-[#FF5A1F]">VIEW ALL →</a>
            </div>
            <div id="live-bookings-feed" class="space-y-3">
              <!-- Dynamically populated rows -->
              <p class="text-sm text-[#B9B6AC] skeleton h-20 rounded-md"></p>
            </div>
          </div>

          <!-- Mechanics on duty (Right 1 col) -->
          <div class="space-y-4">
            <div class="border-b border-[#3A3F49] pb-2">
              <h3 class="font-display text-sm text-[#FF5A1F] tracking-wide uppercase">Mechanics On Duty</h3>
            </div>
            <div id="mechanics-duty-list" class="space-y-3">
              <!-- Dynamically populated list -->
              <p class="text-sm text-[#B9B6AC] skeleton h-20 rounded-md"></p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Initialize Dashboard controllers after authorization check
    document.addEventListener("DOMContentLoaded", () => {
      const checkInterval = setInterval(async () => {
        if (window.currentAdmin && window.supabaseClient) {
          clearInterval(checkInterval);
          const firstWord = (window.adminProfile?.full_name || "Admin").trim().split(/\s+/)[0].toUpperCase();
          document.getElementById("greeting-title").textContent = `GOOD DAY, ${firstWord}`;
          await loadDashboardData();
          initRealtimeDashboard();
        }
      }, 100);
    });

    async function loadDashboardData() {
      try {
        // 1. Load active stats counts
        const { data: allBookings, error: bErr } = await window.supabaseClient
          .from("bookings")
          .select("*")
          .order("created_at", { ascending: false });

        if (bErr) throw bErr;

        let pendingCount = 0;
        let progressCount = 0;
        let completedToday = 0;
        let unassignedEmergency = 0;
        const todayStr = new Date().toDateString();

        if (allBookings) {
          pendingCount = allBookings.filter(b => ["pending", "pending_verification"].includes(b.status)).length;
          progressCount = allBookings.filter(b => ["in_progress", "in-progress", "assigned", "dispatched", "en_route", "completed_awaiting_payment", "payment_submitted"].includes(b.status)).length;
          completedToday = allBookings.filter(b => ["completed", "payment_verified", "paid"].includes(b.status) && new Date(b.created_at).toDateString() === todayStr).length;
          unassignedEmergency = allBookings.filter(b => b.service_type === "emergency" && ["pending", "pending_verification"].includes(b.status)).length;
        }

        document.getElementById("stat-pending").textContent = pendingCount;
        document.getElementById("stat-progress").textContent = progressCount;
        document.getElementById("stat-completed").textContent = completedToday;
        
        const emVal = document.getElementById("stat-emergency");
        const emCard = document.getElementById("stat-emergency-card");
        emVal.textContent = unassignedEmergency;
        if (unassignedEmergency > 0) {
          emVal.className = "font-mono text-3xl font-bold text-red-500 animate-pulse";
          emCard.className = "card p-5 text-center space-y-1 border border-red-500/40 shadow-lg shadow-red-500/5 bg-red-950/10";
        } else {
          emVal.className = "font-mono text-3xl font-bold text-[#F4F1E8]";
          emCard.className = "card p-5 text-center space-y-1";
        }

        // 2. Render Live Feed (top 7 newest bookings)
        const feedContainer = document.getElementById("live-bookings-feed");
        if (allBookings && allBookings.length > 0) {
          const recentB = allBookings.slice(0, 7);
          feedContainer.innerHTML = recentB.map(b => {
            const timeDiff = getRelativeTime(new Date(b.created_at));
            const statusPill = getStatusPill(b.status);
            const isEmergency = b.service_type === "emergency";
            const typeLabel = isEmergency 
              ? `<span class="px-2 py-0.5 rounded text-[9px] uppercase font-mono tracking-wider font-semibold bg-red-500/10 text-red-400 border border-red-500/20"><i class="fa-solid fa-triangle-exclamation"></i> Emergency</span>`
              : `<span class="px-2 py-0.5 rounded text-[9px] uppercase font-mono tracking-wider font-semibold bg-[#22262E] text-[#B9B6AC] border border-[#3A3F49]">${(b.service_type || "service").replace("-", " ")}</span>`;

            return `
              <div onclick="window.location.href='admin-bookings.html?id=${b.id}'" class="card p-4 flex justify-between items-center cursor-pointer transition-all hover:border-[#FF5A1F]/40 hover:-translate-y-0.5">
                <div class="space-y-1">
                  <div class="flex items-center gap-2.5">
                    <span class="font-mono text-xs font-bold text-[#FF5A1F]">#${b.id.substring(0, 8).toUpperCase()}</span>
                    <span class="text-xs text-[#B9B6AC] font-display uppercase font-semibold">${b.bike_brand || ""} ${b.bike_model || "Motorcycle"}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    ${typeLabel}
                    <span class="text-[10px] text-[#B9B6AC] font-mono"><i class="fa-solid fa-clock"></i> ${timeDiff}</span>
                  </div>
                </div>
                <div>
                  ${statusPill}
                </div>
              </div>
            `;
          }).join("");
        } else {
          feedContainer.innerHTML = `<div class="card p-6 text-center text-xs text-[#B9B6AC]">No repair requests found.</div>`;
        }

        // 3. Render Mechanics On Duty roster
        const rosterContainer = document.getElementById("mechanics-duty-list");
        const { data: mechanics, error: mErr } = await window.supabaseClient
          .from("mechanics")
          .select("*")
          .order("name", { ascending: true });

        if (mErr) throw mErr;

        if (mechanics && mechanics.length > 0) {
          // Get active job counts per mechanic
          const activeJobsMap = {};
          if (allBookings) {
            allBookings.forEach(b => {
              if (b.assigned_mechanic_id && ["assigned", "in_progress", "in-progress", "dispatched", "en_route", "completed_awaiting_payment"].includes(b.status)) {
                activeJobsMap[b.assigned_mechanic_id] = (activeJobsMap[b.assigned_mechanic_id] || 0) + 1;
              }
            });
          }

          rosterContainer.innerHTML = mechanics.map(m => {
            const activeCount = activeJobsMap[m.id] || 0;
            const statusDot = m.on_duty 
              ? `<span class="h-2 w-2 rounded-full bg-green-400 inline-block mr-2 animate-pulse"></span>`
              : `<span class="h-2 w-2 rounded-full bg-[#3A3F49] inline-block mr-2"></span>`;
            
            const dutyText = m.on_duty 
              ? `<span class="text-[10px] font-mono text-green-400 font-semibold uppercase">On Duty</span>`
              : `<span class="text-[10px] font-mono text-[#B9B6AC] uppercase">Off Duty</span>`;

            const jobsText = m.on_duty 
              ? `<span class="text-xs text-[#B9B6AC] font-mono">${activeCount} active job${activeCount !== 1 ? 's' : ''}</span>`
              : `<span class="text-xs text-[#3A3F49] font-mono">—</span>`;

            return `
              <div onclick="window.location.href='admin-mechanics.html'" class="card p-4 flex justify-between items-center cursor-pointer transition-all hover:border-[#FF5A1F]/40 hover:-translate-y-0.5">
                <div class="flex items-center gap-1">
                  ${statusDot}
                  <div>
                    <h5 class="text-sm font-semibold">${m.name}</h5>
                    <p class="text-[10px] text-[#B9B6AC] uppercase font-mono">${m.specialty}</p>
                  </div>
                </div>
                <div class="text-right flex flex-col items-end">
                  ${dutyText}
                  ${jobsText}
                </div>
              </div>
            `;
          }).join("");
        } else {
          rosterContainer.innerHTML = `
            <div class="card p-6 text-center text-xs text-[#B9B6AC] space-y-2">
              <p>No mechanics registered yet.</p>
              <a href="admin-mechanics.html" class="btn btn-outline !py-1 !px-3 !text-[10px]"><i class="fa-solid fa-plus"></i> Add Mechanic</a>
            </div>
          `;
        }

      } catch (err) {
        console.error("Error loading dashboard data:", err);
      }
    }

    function initRealtimeDashboard() {
      // Subscribe to all changes in the bookings table
      window.supabaseClient
        .channel("bookings-realtime-overview")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "bookings" },
          async () => {
            await loadDashboardData();
          }
        )
        .subscribe();

      // Subscribe to changes in the mechanics table
      window.supabaseClient
        .channel("mechanics-realtime-overview")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "mechanics" },
          async () => {
            await loadDashboardData();
          }
        )
        .subscribe();
    }

    // Relative timestamp converter helper
    function getRelativeTime(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = Math.floor(seconds / 31536000);
      if (interval >= 1) return interval + "y ago";
      interval = Math.floor(seconds / 2592000);
      if (interval >= 1) return interval + "mo ago";
      interval = Math.floor(seconds / 86400);
      if (interval >= 1) return interval + "d ago";
      interval = Math.floor(seconds / 3600);
      if (interval >= 1) return interval + "h ago";
      interval = Math.floor(seconds / 60);
      if (interval >= 1) return interval + "m ago";
      return seconds < 10 ? "Just now" : seconds + "s ago";
    }

    // Comprehensive Status Badges mapping helper
    function getStatusPill(status) {
      let badgeColorClass = "bg-[#3A3F49] text-[#B9B6AC]";
      let label = status || "Pending";

      if (status === "pending_verification") {
        badgeColorClass = "bg-amber-500/15 text-amber-400 border border-amber-500/20";
        label = "Verifying Deposit";
      } else if (status === "payment_rejected") {
        badgeColorClass = "bg-red-500/15 text-red-400 border border-red-500/20";
        label = "Deposit Rejected";
      } else if (status === "pending") {
        badgeColorClass = "bg-yellow-500/15 text-yellow-400";
        label = "Pending Queue";
      } else if (status === "assigned" || status === "confirmed") {
        badgeColorClass = "bg-blue-500/15 text-blue-400";
        label = "Assigned";
      } else if (status === "dispatched") {
        badgeColorClass = "bg-yellow-500/15 text-yellow-400";
        label = "Dispatched";
      } else if (status === "en_route") {
        badgeColorClass = "bg-cyan-500/15 text-cyan-400 border border-cyan-500/20 animate-pulse";
        label = "En Route";
      } else if (status === "in_progress" || status === "in-progress") {
        badgeColorClass = "bg-[#FF5A1F]/15 text-[#FF5A1F]";
        label = "In Progress";
      } else if (status === "completed_awaiting_payment") {
        badgeColorClass = "bg-orange-500/15 text-orange-400 border border-orange-500/20";
        label = "Awaiting Final Pay";
      } else if (status === "payment_submitted") {
        badgeColorClass = "bg-purple-500/15 text-purple-400 border border-purple-500/20";
        label = "Payment Submitted";
      } else if (status === "payment_verified" || status === "paid") {
        badgeColorClass = "bg-green-500/15 text-green-400 border border-green-500/20";
        label = "Paid & Verified";
      } else if (status === "completed") {
        badgeColorClass = "bg-green-500/15 text-green-400";
        label = "Completed";
      } else if (status === "cancelled") {
        badgeColorClass = "bg-red-500/15 text-red-400";
        label = "Cancelled";
      }

      return `<span class="px-2 py-0.5 rounded text-[10px] uppercase font-mono tracking-wider font-semibold ${badgeColorClass}">${label}</span>`;
    }
  </script>
  <script src="assets/agentation-bundle.js"></script>
</body>
</html>
